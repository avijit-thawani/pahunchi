<!doctype html>
<meta charset="utf-8">
<title>phoney replays</title>
<style>
  /* Title and toggles stay put; only the table scrolls (both ways), under its own header and first column. */
  body { font: 14px -apple-system, system-ui; background: #fff; color: #1a1c21; margin: 0; padding: 20px 20px 0; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden }
  a { color: #0b57d0; text-decoration: none } a:hover { text-decoration: underline }
  .top { display: flex; align-items: baseline; gap: 18px; margin-bottom: 10px }
  h1 { font-size: 20px; margin: 0 auto 0 0 }
  .top label { font-size: 13px; cursor: pointer; user-select: none }
  .wrap { flex: 1; min-height: 0; overflow: auto; padding-bottom: 40px }
  table { border-collapse: collapse; width: 100% }
  td, th { padding: 5px 10px; text-align: left; white-space: nowrap }
  th { position: sticky; top: 0; z-index: 2; background: #fff; color: #6b7280; font-size: 11px; text-transform: uppercase;
       cursor: pointer; user-select: none; box-shadow: 0 1px 0 #e3e5e8 }
  th:hover, th.on { color: #1a1c21 }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums }
  td:first-child, th:first-child { position: sticky; left: 0; background: #fff; z-index: 1 }
  th:first-child { z-index: 3 }
  tbody tr:hover td { background: #f4f5f7 }
  tr.g td { padding-top: 16px; border-bottom: 1px solid #e3e5e8 }
  tr.g td:first-child { position: static }
  tr.g .gh { position: sticky; left: 10px; display: inline-block }
  tr.g b { font-size: 15px }
  tr.g:hover td { background: none }
  .dim { color: #6b7280 }
  td.said { max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: #3c4048 }
  .slow { color: #d6336c } .ok { color: #1a7f37 }
</style>
<div class="top"><h1>phoney calls</h1><label><input type="checkbox" id="spoke"> Only calls where the user spoke</label><label><input type="checkbox" id="grp" checked> Group by user</label></div>
<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<script>
const D = /*DATA*/null
const state = { key: 'at', dir: -1, group: true, spoke: false }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const median = (xs) => (xs.length ? [...xs].sort((a, b) => a - b)[Math.floor(xs.length / 2)] : null)
const secs = (ms) => (ms == null ? '–' : (ms / 1000).toFixed(1) + ' s')
const speed = (ms) => (ms == null ? '' : ms >= 3500 ? 'slow' : ms <= 2700 ? 'ok' : '')
const len = (s) => (s == null ? '–' : s >= 60 ? Math.floor(s / 60) + 'm ' + String(Math.round(s % 60)).padStart(2, '0') + 's' : Math.round(s) + ' s')
const when = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
// Calls logged since 2026-11-10 carry the phone's zone ("Asia/Kolkata"). Older ones only give a UTC offset (from the
// session id): offsets with one obvious zone get its name, the rest stay as an offset.
const ZONES = { 330: 'IST', '-300': 'EST', '-240': 'EDT', '-360': 'CST', '-420': 'MST', '-480': 'PST', 0: 'GMT', 60: 'CET', 345: 'NPT', 480: 'SGT', 540: 'JST' }
const utc = (min) => 'UTC' + (min < 0 ? '−' : '+') + Math.floor(Math.abs(min) / 60) + (min % 60 ? ':' + String(Math.abs(min) % 60).padStart(2, '0') : '')
const zone = (min, tz) => (tz ? tz.split('/').pop().replace(/_/g, ' ') + ' time' : ZONES[min] ?? utc(min))
const theirClock = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'UTC' })
/** The call's start on the caller's own clock (their UTC offset comes from the session id); hover for yours. */
function started(r) {
  const text = r.tzMin == null ? when.format(r.at) : `${theirClock.format(r.at + r.tzMin * 60000)} <span class="dim">${zone(r.tzMin, r.timeZone)}</span>`
  return `<a href="${esc(r.id)}.html" title="${esc(when.format(r.at))} your time · ${esc(r.id)}">${text}</a>`
}
const cols = [
  { k: 'at', label: 'When', cell: started },
  { k: 'user', label: 'User', cell: (r) => esc(r.user), grouped: false },
  { k: 'said', label: 'First words', cls: 'said', cell: (r) => `<span title="${esc(r.said)}">${esc(r.said)}</span>` },
  { k: 'userTurns', label: 'User turns', num: true, cell: (r) => r.userTurns },
  { k: 'median', label: 'Median', num: true, cell: (r) => `<b class="${speed(r.median)}">${secs(r.median)}</b>` },
  { k: 'slowest', label: 'Slowest', num: true, cell: (r) => `<span class="${speed(r.slowest)}">${secs(r.slowest)}</span>` },
  { k: 'lengthS', label: 'Length', num: true, cell: (r) => len(r.lengthS) },
  { k: 'who', label: 'Role', cell: (r) => esc(r.who) },
  { k: 'language', label: 'Language', cell: (r) => esc(r.language) },
  { k: 'device', label: 'Device', cell: (r) => esc(r.device) || '<span class="dim">–</span>' },
]
function cmp(a, b) {
  const x = a[state.key], y = b[state.key]
  if (x == null || x === '') return y == null || y === '' ? 0 : 1 // blanks last in either direction
  if (y == null || y === '') return -1
  return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * state.dir
}
function render() {
  const shown = cols.filter((c) => !(state.group && c.grouped === false))
  document.getElementById('head').innerHTML = shown.map((c, i) => {
    const on = c.k === state.key
    return `<th data-i="${cols.indexOf(c)}" class="${c.num ? 'num ' : ''}${on ? 'on' : ''}">${c.label}${on ? (state.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`
  }).join('')
  const rows = D.rows.filter((r) => !state.spoke || r.userTurns > 0).sort(cmp)
  const tr = (r) => `<tr>${shown.map((c) => `<td class="${c.num ? 'num ' : ''}${c.cls ?? ''}">${c.cell(r)}</td>`).join('')}</tr>`
  let html = ''
  if (!state.group) html = rows.map(tr).join('')
  else {
    // Groups keep the sort: each appears where its first call lands; test scripts go last.
    const groups = new Map()
    for (const r of rows) (groups.get(r.user) ?? groups.set(r.user, []).get(r.user)).push(r)
    const order = [...groups.keys()].sort((a, b) => (a === D.scripts) - (b === D.scripts))
    for (const name of order) {
      const g = groups.get(name)
      html += `<tr class="g"><td colspan="${shown.length}"><span class="gh"><b>${esc(name)}</b></span></td></tr>` + g.map(tr).join('')
    }
  }
  document.getElementById('body').innerHTML = html
}
document.getElementById('head').onclick = (e) => {
  const th = e.target.closest('th')
  if (!th) return
  const c = cols[+th.dataset.i]
  if (state.key === c.k) state.dir = -state.dir
  else { state.key = c.k; state.dir = c.num || c.k === 'at' ? -1 : 1 }
  render()
}
document.getElementById('spoke').onchange = (e) => { state.spoke = e.target.checked; render() }
document.getElementById('grp').onchange = (e) => { state.group = e.target.checked; render() }
render()
</script>
