<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STT reference check</title>
<style>
  body { margin: 0; background: #101114; color: #eceef2; font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 19px; margin: 0; }
  .sub { color: #8b909a; font-size: 13px; }
  .bar { position: sticky; top: 0; background: #101114; padding: 10px 0; border-bottom: 1px solid #2c2f36; z-index: 2; }
  .row { background: #1a1c21; border: 1px solid #2c2f36; border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .row.done { border-color: #3a7d4f; }
  .top { display: flex; align-items: center; gap: 10px; }
  .n { font-weight: 800; width: 28px; color: #8b909a; }
  button.play { background: #ffcc00; border: 0; border-radius: 999px; width: 38px; height: 38px; font-size: 15px; cursor: pointer; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 8px; background: #101114; color: #eceef2; border: 1px solid #3a3e47; border-radius: 8px; font: 17px/1.4 inherit; padding: 8px; resize: vertical; }
  .actions { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .ok { background: #5adc78; color: #111; border: 0; border-radius: 8px; font-weight: 800; padding: 6px 14px; cursor: pointer; }
  details { margin-top: 6px; color: #8b909a; font-size: 13px; }
  details div { margin: 2px 0; }
  details b { color: #b9bdc6; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1>Check the reference transcripts</h1>
    <div class="sub">Play each line, fix the text if it isn't what you said, press Correct (or Enter). Hindi in Devanagari, English words in English letters. Blank = no speech. <b id="count"></b></div>
  </div>
  <div id="rows"></div>
</main>
<script>
const ROWS = /*ROWS*/[];
const audio = new Audio();
const count = () => { document.getElementById('count').textContent = ROWS.filter((r) => r.done).length + ' / ' + ROWS.length + ' done'; };
ROWS.forEach((r) => {
  const d = document.createElement('div');
  d.className = 'row' + (r.done ? ' done' : '');
  d.innerHTML = '<div class="top"><span class="n">' + r.i + '</span><button class="play">▶</button><span class="sub">' + r.seconds + ' s · ' + r.key + '</span></div>' +
    '<textarea rows="2"></textarea><div class="actions"><button class="ok">Correct</button><span class="sub saved"></span></div>' +
    '<details><summary>what the engines heard</summary>' + r.others.map(([l, t]) => '<div><b>' + l + ':</b> ' + (t || '—').replace(/</g, '&lt;') + '</div>').join('') + '</details>';
  const ta = d.querySelector('textarea');
  ta.value = r.text;
  d.querySelector('.play').onclick = () => { audio.src = r.src; audio.play(); };
  const save = async () => {
    const res = await fetch('/save', { method: 'POST', body: JSON.stringify({ key: r.key, text: ta.value.trim() }) });
    if (!res.ok) { d.querySelector('.saved').textContent = 'not saved'; return; }
    r.done = true; d.classList.add('done'); d.querySelector('.saved').textContent = 'saved'; count();
    const next = d.nextElementSibling;
    if (next) { next.scrollIntoView({ block: 'center', behavior: 'smooth' }); next.querySelector('.play').click(); }
  };
  d.querySelector('.ok').onclick = save;
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); } });
  document.getElementById('rows').append(d);
});
count();
</script>
</body>
</html>
